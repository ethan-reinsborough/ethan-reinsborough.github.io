  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

rc: url(\"1ed32bba-c693-4742-837d-07007c92865d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"42f2e599-b5e2-4163-b322-f0a4e16dc0a7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --bg:        #f6ecd2;\n    --bg-deep:   #ebdfba;\n    --paper:     #fffaee;\n    --paper-2:   #fdf3da;\n    --ink:       #3b2a17;\n    --ink-soft:  #6e5a40;\n    --ink-mute:  #957f60;\n    --line:      #e3d3a8;\n    --line-soft: #efe3c2;\n\n    /* roadmap lane colors */\n    --live:      #6ea05a;\n    --live-bg:   #e6efd2;\n    --flight:    #5b8db8;\n    --flight-bg: #d8e6f1;\n    --next:      #cf8a3a;\n    --next-bg:   #f5e3c2;\n    --north:     #8a6db0;\n    --north-bg:  #e4d9ee;\n\n    --shadow-s: 0 1px 0 rgba(120,90,40,.08), 0 2px 6px rgba(120,90,40,.08);\n    --shadow-m: 0 1px 0 rgba(120,90,40,.10), 0 8px 20px -8px rgba(120,90,40,.20);\n    --shadow-l: 0 2px 0 rgba(120,90,40,.10), 0 18px 40px -16px rgba(120,90,40,.22);\n    --r-s: 10px;\n    --r-m: 16px;\n    --r-l: 22px;\n  }\n\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0}\n  body{\n    background: var(--bg);\n    background-image:\n      radial-gradient(1100px 600px at 12% -10%, #fff4d6 0%, transparent 60%),\n      radial-gradient(900px 700px at 100% 0%, #f4e3b5 0%, transparent 55%),\n      radial-gradient(700px 700px at 50% 110%, #efe0b0 0%, transparent 60%);\n    color: var(--ink);\n    font-family: \"Nunito\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n    font-size: 16.5px;\n    line-height: 1.62;\n    -webkit-font-smoothing: antialiased;\n  }\n  a{color:#7a4a1e; text-underline-offset:3px; text-decoration-thickness:1.5px}\n  a:hover{color:#553010}\n\n  h1,h2,h3,h4{\n    font-family:\"Fredoka\", system-ui, sans-serif;\n    font-weight:700;\n    color:var(--ink);\n    letter-spacing:-0.005em;\n    margin:0 0 .35em;\n    text-wrap: balance;\n  }\n  h1{font-size:2.55rem; line-height:1.05}\n  h2{font-size:1.85rem; line-height:1.1; margin-top:0}\n  h3{font-size:1.25rem}\n  h4{font-size:1.02rem; font-weight:600}\n  p{margin:.5em 0; text-wrap:pretty}\n  ul,ol{padding-left:1.15em}\n  li{margin:.25em 0}\n  strong{color:#2c1d0c}\n  em{color:#5a3a1a}\n  code{\n    font-family:\"JetBrains Mono\", ui-monospace, monospace;\n    font-size: .88em;\n    background: #f0e2bc;\n    color:#5a3a14;\n    padding: 1px 6px;\n    border-radius: 6px;\n    border: 1px solid #e3d3a8;\n  }\n  blockquote{\n    margin:.6em 0;\n    padding:.6em .95em;\n    background: #fff5d8;\n    border-left: 4px solid #d9b96a;\n    border-radius: 0 12px 12px 0;\n    color:#5b4220;\n    font-style: italic;\n  }\n\n  /* ---------- LAYOUT ---------- */\n  .layout{\n    display:grid;\n    grid-template-columns: 268px minmax(0, 1fr);\n    gap: 0;\n    max-width: 1280px;\n    margin: 0 auto;\n    padding: 0 28px;\n  }\n  aside.sidebar{\n    position: sticky;\n    top: 0;\n    align-self: start;\n    height: 100vh;\n    padding: 28px 18px 28px 0;\n    border-right: 1px dashed #d8c594;\n    overflow-y: auto;\n  }\n  aside.sidebar::-webkit-scrollbar{ width:6px }\n  aside.sidebar::-webkit-scrollbar-thumb{ background:#d8c594; border-radius:3px }\n\n  .brand{\n    display:flex; align-items:center; gap:10px;\n    padding: 4px 6px 10px;\n    margin-bottom: 8px;\n  }\n  .brand-mark{\n    width:38px; height:38px; border-radius: 12px;\n    background: linear-gradient(160deg, #ffd984, #e9a64a);\n    box-shadow: inset 0 -3px 0 rgba(120,70,20,.18), var(--shadow-s);\n    display:grid; place-items:center;\n    font-family:\"Fredoka\"; font-weight:700; color:#5a3410; font-size:18px;\n  }\n  .brand-name{font-family:\"Fredoka\"; font-weight:700; font-size:1.05rem; line-height:1}\n  .brand-sub{font-size:.78rem; color:var(--ink-mute); margin-top:2px}\n\n  nav.toc{\n    display:flex; flex-direction:column; gap:2px;\n    font-size: .93rem;\n  }\n  nav.toc a{\n    display:flex; align-items:center; gap:9px;\n    padding: 7px 10px;\n    border-radius: 9px;\n    color: var(--ink-soft);\n    text-decoration: none;\n    line-height: 1.25;\n  }\n  nav.toc a:hover{ background: #fff3d4; color: var(--ink) }\n  nav.toc a.active{ background: #fff0c7; color: var(--ink); box-shadow: inset 0 0 0 1px #ecd58a }\n  nav.toc a .num{\n    font-family:\"JetBrains Mono\"; font-size:.74rem; color:var(--ink-mute);\n    min-width: 22px;\n  }\n  nav.toc .group-label{\n    margin: 14px 10px 4px;\n    font-size: .7rem; letter-spacing:.12em; text-transform:uppercase;\n    color: var(--ink-mute);\n  }\n\n  .toc-foot{\n    margin-top: 22px;\n    padding: 10px 12px;\n    border-radius: 12px;\n    background: #fff5d8;\n    border: 1px dashed #dcc384;\n    font-size:.8rem;\n    color: var(--ink-soft);\n  }\n\n  /* mobile nav toggle */\n  .mobile-bar{ display:none; }\n\n  main{\n    padding: 28px 0 100px 36px;\n    min-width: 0;\n  }\n\n  section.s{\n    margin: 0 0 56px;\n    scroll-margin-top: 24px;\n  }\n  @media (max-width: 980px){\n    section.s{ scroll-margin-top: 76px; }\n  }\n  .s-tag{\n    display:inline-flex; align-items:center; gap:8px;\n    font-family:\"JetBrains Mono\"; font-size:.72rem;\n    color: #8a6a2b;\n    background:#fff3d4;\n    border:1px solid #e8d18a;\n    padding: 3px 9px; border-radius: 999px;\n    letter-spacing: .08em;\n    margin-bottom: 12px;\n  }\n\n  /* ---------- HERO ---------- */\n  .hero{\n    background: linear-gradient(180deg, #fffaee 0%, #fff3d4 100%);\n    border: 1px solid var(--line);\n    border-radius: var(--r-l);\n    padding: 34px 36px 30px;\n    box-shadow: var(--shadow-l);\n    margin: 8px 0 48px;\n    position: relative;\n    overflow: hidden;\n  }\n  .hero::before{\n    content:\"\"; position:absolute; inset:auto -40px -60px auto;\n    width: 260px; height: 260px; border-radius:50%;\n    background: radial-gradient(circle at 30% 30%, #ffe6a3, #f1c46a 60%, transparent 70%);\n    opacity:.55; pointer-events:none;\n  }\n  .hero-eyebrow{\n    font-family:\"JetBrains Mono\"; font-size:.78rem;\n    color:#8a6a2b; letter-spacing:.14em; text-transform:uppercase;\n  }\n  .hero h1{\n    font-size: 3.1rem; line-height:1; margin:.18em 0 .15em;\n  }\n  .hero .tag{\n    font-size: 1.15rem; color: var(--ink-soft); max-width: 60ch;\n    font-style: italic;\n  }\n  .hero-meta{\n    margin-top: 8px;\n    display:flex; flex-wrap:wrap; gap:10px 16px;\n    font-size:.9rem; color: var(--ink-mute);\n  }\n  .hero-meta b{color:var(--ink-soft)}\n\n  .stat-row{\n    margin-top: 24px;\n    display:grid;\n    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));\n    gap: 12px;\n    position: relative;\n  }\n  .stat{\n    background: #fffaee;\n    border: 1px solid var(--line);\n    border-radius: 14px;\n    padding: 14px 16px;\n    box-shadow: var(--shadow-s);\n  }\n  .stat .v{\n    font-family:\"Fredoka\"; font-weight:700; font-size:1.55rem; line-height:1.05;\n    color: var(--ink);\n  }\n  .stat .k{\n    font-size:.78rem; color: var(--ink-mute); text-transform:uppercase;\n    letter-spacing:.08em; margin-top:4px;\n  }\n  .stat.accent{ background: #fff3d4; border-color:#e8d18a }\n  .stat.accent .v{ color:#7a4a1e }\n\n  /* ---------- CARDS / GENERAL ---------- */\n  .card{\n    background: var(--paper);\n    border: 1px solid var(--line);\n    border-radius: var(--r-m);\n    padding: 22px 24px;\n    box-shadow: var(--shadow-m);\n  }\n  .grid-2{ display:grid; grid-template-columns: 1fr 1fr; gap: 18px; }\n  .grid-3{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }\n  @media (max-width: 880px){\n    .grid-2, .grid-3{ grid-template-columns: 1fr; }\n  }\n\n  /* §1 hero + market gap */\n  .body-copy{ font-size: 1.04rem }\n  .body-copy p:first-child::first-letter{\n    font-family:\"Fredoka\"; font-weight:700;\n    float:left; font-size: 3.1em; line-height:.85;\n    padding: 6px 10px 0 0; color:#a86518;\n  }\n\n  /* §3 pillars */\n  .pillars{\n    display:grid;\n    grid-template-columns: repeat(5, 1fr);\n    gap: 14px;\n  }\n  @media (max-width: 1100px){ .pillars{ grid-template-columns: repeat(2, 1fr) } }\n  @media (max-width: 560px){ .pillars{ grid-template-columns: 1fr } }\n  .pillar{\n    background: var(--paper);\n    border: 1px solid var(--line);\n    border-radius: var(--r-m);\n    padding: 18px 16px 16px;\n    box-shadow: var(--shadow-s);\n    position: relative;\n  }\n  .pillar .ico{\n    width:54px; height:54px; border-radius:14px;\n    display:grid; place-items:center; font-size: 28px;\n    background: #fff3d4;\n    border:1px solid #e8d18a;\n    margin-bottom: 10px;\n    box-shadow: inset 0 -2px 0 rgba(120,70,20,.08);\n  }\n  .pillar h4{ font-family:\"Fredoka\"; font-size:1.05rem; margin-bottom:4px }\n  .pillar p{ font-size:.92rem; color: var(--ink-soft); margin:0 }\n  .pillar.p1 .ico{ background:#ffe6c4; border-color:#f0c98a }\n  .pillar.p2 .ico{ background:#ffd9d9; border-color:#eaa6a6 }\n  .pillar.p3 .ico{ background:#dceec5; border-color:#a8c98a }\n  .pillar.p4 .ico{ background:#cfe1f1; border-color:#9bbedd }\n  .pillar.p5 .ico{ background:#e7d8f0; border-color:#bda1d4 }\n\n  /* §4 sacred / flexible */\n  .sf{\n    display:grid; grid-template-columns: 1fr 1fr; gap: 18px;\n  }\n  @media (max-width: 880px){ .sf{ grid-template-columns: 1fr } }\n  .sf-col{\n    border-radius: var(--r-m);\n    padding: 20px 22px;\n    border: 1px solid var(--line);\n    box-shadow: var(--shadow-s);\n  }\n  .sf-col.sacred{ background: #fff0d6; border-color:#ecc888 }\n  .sf-col.flex{   background: #e8f0d6; border-color:#bcd29a }\n  .sf-col h3{ display:flex; align-items:center; gap:9px; margin-top:0 }\n  .sf-col .head-note{ font-size:.85rem; color: var(--ink-soft); margin-bottom: 12px }\n  .tag-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px }\n  .tag-list .t{\n    background: #fffaee;\n    border: 1px solid rgba(120,80,30,.18);\n    border-radius: 999px;\n    padding: 6px 12px;\n    font-size: .88rem;\n    color: var(--ink);\n    box-shadow: var(--shadow-s);\n    line-height: 1.25;\n  }\n  .sacred .t{ border-color: #e0b86c }\n  .flex   .t{ border-color: #a8c282 }\n\n  /* §5 table */\n  .ref-table{\n    width:100%; border-collapse: separate; border-spacing:0;\n    background: var(--paper);\n    border:1px solid var(--line); border-radius: var(--r-m);\n    overflow: hidden;\n    box-shadow: var(--shadow-s);\n  }\n  .ref-table th, .ref-table td{\n    text-align:left; padding: 12px 16px;\n    border-bottom: 1px dashed #e3d3a8;\n    font-size: .95rem;\n  }\n  .ref-table th{ background:#fff3d4; font-family:\"Fredoka\"; font-weight:600 }\n  .ref-table tr:last-child td{ border-bottom: none }\n\n  .insp-grid{\n    display:grid; grid-template-columns: repeat(2, 1fr); gap: 12px;\n    margin-top: 14px;\n  }\n  @media (max-width: 880px){ .insp-grid{ grid-template-columns: 1fr } }\n  .insp{\n    background: var(--paper);\n    border: 1px solid var(--line);\n    border-radius: 14px;\n    padding: 14px 16px;\n    box-shadow: var(--shadow-s);\n  }\n  .insp h4{ font-family:\"Fredoka\"; margin:0 0 4px; font-size: 1rem }\n  .insp p{ font-size:.92rem; color: var(--ink-soft); margin:0 }\n  .insp .from{ font-size:.75rem; color:#a37934; text-transform:uppercase; letter-spacing:.08em }\n\n  /* ---------- §6 ROADMAP SWIMLANE (centerpiece) ---------- */\n  .roadmap{\n    background:\n      repeating-linear-gradient(0deg, transparent, transparent 11px, rgba(120,90,40,.04) 11px, rgba(120,90,40,.04) 12px),\n      #fffaee;\n    border:1px solid var(--line);\n    border-radius: var(--r-l);\n    padding: 8px 18px 22px;\n    box-shadow: var(--shadow-l);\n  }\n  .lane{\n    padding: 18px 0 22px;\n    border-top: 1px dashed #d8c594;\n  }\n  .lane:first-of-type{ border-top:none; padding-top: 14px }\n\n  .lane-head{\n    display:flex; align-items:center; gap:14px;\n    margin-bottom: 14px;\n  }\n  .lane-pill{\n    display:inline-flex; align-items:center; gap:10px;\n    padding: 10px 18px 10px 14px;\n    border-radius: 999px;\n    font-family:\"Fredoka\"; font-weight:700; font-size:1.15rem;\n    box-shadow: var(--shadow-s);\n    color: #2c1d0c;\n    flex: 0 0 auto;\n  }\n  .lane-pill .lp-ico{\n    font-size: 1.25rem; line-height:1;\n    display:inline-block; transform: translateY(-1px);\n  }\n  .lane-pill .lp-count{\n    font-family:\"JetBrains Mono\"; font-weight:500;\n    font-size: .72rem;\n    background: rgba(255,255,255,.55);\n    border: 1px solid rgba(120,80,30,.18);\n    padding: 2px 7px; border-radius:999px;\n    margin-left: 4px;\n    color: #5a3a14;\n  }\n  .lane-rule{\n    flex:1; height:0;\n    border-top: 2px dotted #d8c594;\n  }\n  .lane-note{ font-size:.85rem; color: var(--ink-soft); flex: 0 0 auto; max-width: 240px; line-height:1.35; font-style: italic }\n\n  .lane.live  .lane-pill{ background: var(--live-bg);   border:1.5px solid #97bd74 }\n  .lane.flight .lane-pill{ background: var(--flight-bg); border:1.5px solid #8fb6d3 }\n  .lane.next  .lane-pill{ background: var(--next-bg);   border:1.5px solid #d7a85f }\n  .lane.north .lane-pill{ background: var(--north-bg);  border:1.5px solid #a98ac7 }\n\n  .feat-row{\n    display:grid;\n    grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));\n    gap: 12px;\n  }\n  .feat-row.dense{\n    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));\n    gap: 10px;\n  }\n  .feat{\n    background: var(--paper);\n    border: 1px solid var(--line);\n    border-radius: 14px;\n    padding: 14px 14px 13px;\n    box-shadow: var(--shadow-s);\n    position: relative;\n    transition: transform .15s ease, box-shadow .15s ease;\n    display:flex; flex-direction:column;\n  }\n  .feat:hover{ transform: translateY(-2px); box-shadow: var(--shadow-m) }\n\n  .feat .emoji{\n    font-size: 30px; line-height: 1;\n    display:block; margin-bottom: 8px;\n  }\n  .feat .ttl{\n    font-family:\"Fredoka\"; font-weight:600; font-size:1rem;\n    color: var(--ink); line-height:1.18;\n  }\n  .feat .desc{\n    font-size:.86rem; color: var(--ink-soft); margin-top:6px; line-height:1.4;\n  }\n  .feat .desc.quote{\n    font-style: italic; color:#6b5230;\n  }\n\n  /* lane-tinted feature cards */\n  .lane.live  .feat{ background:#f6fae8; border-color:#cfe0a8 }\n  .lane.flight .feat{ background:#eef4fa; border-color:#bdd3e6 }\n  .lane.next  .feat{ background:#fdf2da; border-color:#e8c878 }\n  .lane.north .feat{ background:#f1e9f6; border-color:#cbb4dd }\n\n  /* Live lane uses compact chip cards — many shipped, low individual weight */\n  .lane.live .feat{\n    flex-direction: row; align-items:center; gap:10px;\n    padding: 10px 12px;\n  }\n  .lane.live .feat .emoji{ font-size:22px; margin: 0 }\n  .lane.live .feat .ttl{ font-size:.92rem; font-family:\"Nunito\"; font-weight:700; color: var(--ink) }\n\n  /* hero blocks in roadmap (called-out feature categories) */\n  .feat-hero{\n    grid-column: 1 / -1;\n    background: linear-gradient(180deg, #fff5d8, #ffeebb);\n    border: 1.5px solid #e8c878;\n    border-radius: 16px;\n    padding: 18px 20px;\n    box-shadow: var(--shadow-m);\n    display:grid;\n    grid-template-columns: auto 1fr;\n    gap: 16px;\n    align-items: center;\n  }\n  .feat-hero .hero-ico{\n    width: 64px; height: 64px;\n    background: #fffaee;\n    border: 1.5px solid #e8c878;\n    border-radius: 18px;\n    display:grid; place-items:center;\n    font-size: 36px; line-height:1;\n    box-shadow: var(--shadow-s);\n  }\n  .lane.north .feat-hero{\n    background: linear-gradient(180deg, #efe5f6, #e0d2ee);\n    border-color: #c2a8db;\n  }\n  .lane.north .feat-hero .hero-ico{ border-color:#c2a8db }\n  .feat-hero h4{ font-family:\"Fredoka\"; font-size:1.2rem; margin:0 0 4px; }\n  .feat-hero p{ font-size:.95rem; color:#5a4220; margin:0 }\n  .feat-hero .sub{\n    display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;\n  }\n\n  .feat-hero .sub .chip{\n    background:#fffaee; border:1px solid #e3d3a8; border-radius:999px;\n    padding:4px 10px; font-size:.82rem; color:var(--ink-soft);\n  }\n\n  /* worked-examples after roadmap */\n  .callout{\n    background: #fff5d8;\n    border: 1px solid #e8c878;\n    border-radius: var(--r-m);\n    padding: 18px 22px;\n    margin-top: 18px;\n    box-shadow: var(--shadow-s);\n  }\n  .callout h4{ font-family:\"Fredoka\"; margin-top:0 }\n\n  /* ---------- §7 CARDS PHASES ---------- */\n  .phases{\n    display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px;\n    counter-reset: phase;\n  }\n  @media (max-width: 880px){ .phases{ grid-template-columns: 1fr } }\n  .phase{\n    background: var(--paper);\n    border: 1px solid var(--line);\n    border-radius: var(--r-m);\n    padding: 18px 18px 16px;\n    box-shadow: var(--shadow-s);\n    position: relative;\n    counter-increment: phase;\n  }\n  .phase::before{\n    content: counter(phase);\n    position:absolute; top:-14px; left:18px;\n    width:32px; height:32px; border-radius:50%;\n    background:#fff3d4; border:2px solid #e8c878;\n    font-family:\"Fredoka\"; font-weight:700; color:#7a4a1e;\n    display:grid; place-items:center; font-size: 1rem;\n    box-shadow: var(--shadow-s);\n  }\n  .phase .tag-step{\n    font-family:\"JetBrains Mono\"; font-size:.7rem; color:#a37934;\n    letter-spacing:.1em; text-transform:uppercase; margin-bottom: 4px;\n    display:block;\n  }\n  .phase h4{ font-family:\"Fredoka\"; font-size:1.05rem; margin: 0 0 6px }\n  .phase ul{ font-size:.92rem; color: var(--ink-soft); margin: 6px 0 0; padding-left: 1.1em }\n\n  /* ---------- §8 monetization columns ---------- */\n  .mon-grid{\n    display:grid; grid-template-columns: 1fr 1fr; gap:18px;\n  }\n  @media (max-width: 880px){ .mon-grid{ grid-template-columns: 1fr } }\n  .mon-list{\n    background: #fff5d8;\n    border: 1px solid #e8c878;\n    border-radius: var(--r-m);\n    padding: 16px 20px;\n  }\n  .mon-list h4{ font-family:\"Fredoka\"; margin-top:0 }\n  .principles{\n    background: var(--paper);\n    border: 1px solid var(--line);\n    border-radius: var(--r-m);\n    padding: 16px 20px;\n    box-shadow: var(--shadow-s);\n  }\n\n  /* ---------- §9 TECH (QUIET, MUTED) ---------- */\n  .tech-wrap{\n    background: #ecdfb8;\n    border: 1px dashed #c8b27a;\n    border-radius: var(--r-m);\n    padding: 22px 24px;\n    color: #4a3c22;\n    font-family: \"JetBrains Mono\", ui-monospace, monospace;\n    font-size: .92rem;\n    line-height: 1.55;\n  }\n  .tech-wrap h2{\n    font-family:\"JetBrains Mono\"; font-weight:600;\n    font-size: 1.25rem; color:#3b2a17; letter-spacing:0;\n  }\n  .tech-wrap h3{\n    font-family:\"JetBrains Mono\"; font-weight:600;\n    font-size: 1rem; color:#4a3c22; margin-top: 20px;\n  }\n  .tech-wrap .for-engineers{\n    display:inline-flex; align-items:center; gap:8px;\n    font-family:\"JetBrains Mono\"; font-size:.72rem;\n    background:#3b2a17; color:#f0e2bc;\n    padding: 4px 10px; border-radius: 4px;\n    letter-spacing:.1em; text-transform:uppercase;\n    margin-bottom: 14px;\n  }\n  .tech-wrap .skip-note{\n    font-family:\"Nunito\"; font-size:.95rem;\n    color:#6e5a40; font-style: italic;\n    margin: 6px 0 16px;\n  }\n  .tech-wrap code{ background:#dcc98c; border-color:#c5ad6a; color:#3b2a17 }\n  .tech-wrap strong{ color:#2c1d0c }\n  .tech-wrap a{ color:#5a3a14 }\n  .tech-wrap .ttbl{ width:100%; border-collapse: collapse; margin:10px 0 14px; font-size:.85rem }\n  .tech-wrap .ttbl th,.tech-wrap .ttbl td{\n    text-align:left; padding: 8px 10px;\n    border-bottom: 1px dashed #c8b27a;\n    vertical-align: top;\n  }\n  .tech-wrap .ttbl th{ background:#dcc98c; font-weight:600 }\n  .tech-wrap details{\n    background:#e3d3a8; border:1px solid #c8b27a;\n    border-radius: 8px; padding: 10px 14px; margin: 8px 0;\n  }\n  .tech-wrap summary{ cursor:pointer; font-weight:600; color:#3b2a17 }\n  .tech-wrap details[open]{ background:#dcc98c }\n\n  /* ---------- §10 workflow ---------- */\n  .ol-num{ counter-reset: q; list-style:none; padding:0 }\n  .ol-num li{\n    counter-increment: q;\n    display:flex; gap:14px; padding:10px 14px;\n    background: var(--paper); border:1px solid var(--line);\n    border-radius: 12px; margin-bottom:8px;\n    box-shadow: var(--shadow-s);\n  }\n  .ol-num li::before{\n    content: counter(q);\n    flex: 0 0 28px;\n    height: 28px; border-radius:50%;\n    background:#fff3d4; border:1px solid #e8c878;\n    font-family:\"Fredoka\"; font-weight:700; color:#7a4a1e;\n    display:grid; place-items:center; font-size:.92rem;\n  }\n\n  .voice-card{\n    background: var(--paper);\n    border: 1px solid var(--line);\n    border-radius: var(--r-m);\n    padding: 18px 22px;\n    box-shadow: var(--shadow-s);\n  }\n  .samples{\n    display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;\n  }\n  @media (max-width: 880px){ .samples{ grid-template-columns: 1fr } }\n  .samples blockquote{\n    margin: 0;\n    background: #fff5d8;\n    border-left: 4px solid #e8b85a;\n    border-radius: 0 12px 12px 0;\n    padding: 10px 14px;\n    font-size: .95rem;\n  }\n\n  /* glossary */\n  .gloss{\n    background: var(--paper);\n    border: 1px solid var(--line);\n    border-radius: var(--r-m);\n    box-shadow: var(--shadow-s);\n    padding: 6px 4px;\n  }\n  .gloss dl{ margin:0; display:grid; grid-template-columns: 200px 1fr; gap: 6px 14px; padding: 14px }\n  @media (max-width: 700px){ .gloss dl{ grid-template-columns: 1fr } }\n  .gloss dt{\n    font-family:\"Fredoka\"; font-weight:600;\n    color: var(--ink); padding: 6px 8px;\n    background: #fff5d8; border-radius: 8px;\n    align-self: start;\n  }\n  .gloss dd{ margin: 0; padding: 6px 8px; color: var(--ink-soft); font-size:.95rem }\n\n  /* footer */\n  footer.foot{\n    margin-top: 30px;\n    padding-top: 20px;\n    border-top: 1px dashed #d8c594;\n    font-size: .85rem; color: var(--ink-mute);\n    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;\n  }\n\n  /* divider doodle */\n  .div-doodle{\n    text-align:center; color:#c4a866; margin: 6px 0 18px;\n    font-family:\"JetBrains Mono\"; font-size:.85rem; letter-spacing:.5em;\n  }\n\n  /* ---------- MOBILE ---------- */\n  @media (max-width: 980px){\n    .layout{ grid-template-columns: 1fr; padding: 0 18px }\n    aside.sidebar{\n      position: static; height: auto;\n      border-right: none; border-bottom: 1px dashed #d8c594;\n      padding: 12px 0 16px;\n    }\n    .mobile-bar{\n      display:flex; align-items:center; justify-content:space-between;\n      padding: 14px 18px;\n      background: #fffaee;\n      border-bottom: 1px solid var(--line);\n      position: sticky; top:0; z-index: 20;\n      box-shadow: var(--shadow-s);\n    }\n    .mobile-bar .brand{ padding:0; margin:0 }\n    .mobile-bar button{\n      font-family:\"Fredoka\"; font-weight:600;\n      background:#fff3d4; border:1px solid #e8d18a;\n      color:#5a3410; padding: 8px 14px; border-radius:10px;\n      cursor:pointer; font-size:.95rem;\n    }\n    nav.toc{ display:none; padding: 0 8px }\n    nav.toc.open{ display:flex }\n    .toc-foot{ display:none }\n    main{ padding: 20px 0 80px }\n    .brand-desktop{ display:none }\n    .hero{ padding: 26px 22px 22px }\n    .hero h1{ font-size: 2.3rem }\n    .lane-head{ flex-wrap: wrap; gap: 10px }\n    .lane-rule{ display:none }\n    .lane-note{ max-width: none; flex: 1 1 100% }\n    .lane.live .feat{ flex-direction: row }\n    .feat-hero{ grid-template-columns: 1fr; text-align: left }\n    .feat-hero .hero-ico{ width:54px; height:54px; font-size:30px }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"mobile-bar\" role=\"banner\">\n  <div class=\"brand\">\n    <div class=\"brand-mark\">B<\u002Fdiv>\n    <div>\n      <div class=\"brand-name\">Bloxodachi Life<\u002Fdiv>\n      <div class=\"brand-sub\">Vision Doc · internal draft<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <button id=\"menu-btn\" aria-expanded=\"false\" aria-controls=\"toc\">Menu<\u002Fbutton>\n<\u002Fdiv>\n\n<div class=\"layout\">\n\n  <aside class=\"sidebar\" aria-label=\"Sections\">\n    <div class=\"brand brand-desktop\">\n      <div class=\"brand-mark\">B<\u002Fdiv>\n      <div>\n        <div class=\"brand-name\">Bloxodachi Life<\u002Fdiv>\n        <div class=\"brand-sub\">Vision Doc · v draft<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav class=\"toc\" id=\"toc\" aria-label=\"Table of contents\">\n      <div class=\"group-label\">Orientation<\u002Fdiv>\n      <a href=\"#s0\"><span class=\"num\">0<\u002Fspan> How to read this<\u002Fa>\n      <a href=\"#s1\"><span class=\"num\">1<\u002Fspan> What Bloxodachi is<\u002Fa>\n      <a href=\"#s2\"><span class=\"num\">2<\u002Fspan> Target audience<\u002Fa>\n\n      <div class=\"group-label\">The North Stars<\u002Fdiv>\n      <a href=\"#s3\"><span class=\"num\">3<\u002Fspan> Design pillars<\u002Fa>\n      <a href=\"#s4\"><span class=\"num\">4<\u002Fspan> Sacred / flexible<\u002Fa>\n      <a href=\"#s5\"><span class=\"num\">5<\u002Fspan> Positioning &amp; inspirations<\u002Fa>\n\n      <div class=\"group-label\">The Work<\u002Fdiv>\n      <a href=\"#s6\"><span class=\"num\">6<\u002Fspan> The roadmap<\u002Fa>\n      <a href=\"#s7\"><span class=\"num\">7<\u002Fspan> Bloxodachi Cards<\u002Fa>\n      <a href=\"#s8\"><span class=\"num\">8<\u002Fspan> Monetization<\u002Fa>\n\n      <div class=\"group-label\">Inside Baseball<\u002Fdiv>\n      <a href=\"#s9\"><span class=\"num\">9<\u002Fspan> Technical architecture<\u002Fa>\n      <a href=\"#s10\"><span class=\"num\">10<\u002Fspan> How we work<\u002Fa>\n      <a href=\"#sA\"><span class=\"num\">A<\u002Fspan> Glossary<\u002Fa>\n    <\u002Fnav>\n\n    <div class=\"toc-foot\">\n      🕯️ Reading time ~35 min. Sections 1–4 first if you're new.\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main>\n\n    <!-- HERO -->\n    <header class=\"hero\">\n      <div class=\"hero-eyebrow\">Internal · Team onboarding &amp; long-term design reference<\u002Fdiv>\n      <h1>Bloxodachi Life<\u002Fh1>\n      <p class=\"tag\">A cozy, slightly chaotic god-view life sim on Roblox — an island of Robloxians who live, love, fall over, and occasionally cause hilarious disasters.<\u002Fp>\n      <div class=\"hero-meta\">\n        <span>📍 <b>Game ID<\u002Fb> 99981471292876<\u002Fspan>\n        <span>🛠️ Built solo by <b>Ethan Reinsborough<\u002Fb> (Carmite)<\u002Fspan>\n        <span>🧠 Claude Opus + Codex stack<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"stat-row\" aria-label=\"As of signing day\">\n        <div class=\"stat accent\"><div class=\"v\">May&nbsp;9,&nbsp;2026<\u002Fdiv><div class=\"k\">Launched<\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\"><div class=\"v\">7K+<\u002Fdiv><div class=\"k\">Peak CCU<\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\"><div class=\"v\">1.8M+<\u002Fdiv><div class=\"k\">Visits<\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\"><div class=\"v\">99<span style=\"font-size:.7em\">th<\u002Fspan><\u002Fdiv><div class=\"k\">D1 / D7 retention pct<\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\"><div class=\"v\">1M+<\u002Fdiv><div class=\"k\">Robux earned<\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\"><div class=\"v\">3 wks<\u002Fdiv><div class=\"k\">Concept → launch<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- §0 -->\n    <section class=\"s\" id=\"s0\">\n      <span class=\"s-tag\">§0 · ORIENTATION<\u002Fspan>\n      <h2>How to read this doc<\u002Fh2>\n      <div class=\"card\">\n        <p>If you are new to the team, read sections <strong>1–4 first<\u002Fstrong> (what the game is, who it's for, what's sacred). Sections 5–8 are the working reference: roadmap, monetization, the Cards feature, and the technical architecture. Section 9 is how we work together day to day.<\u002Fp>\n        <p>The brand voice in this doc is dialed <em>down<\u002Fem> from how we talk to players — formal enough to be a reference, but you should still leave understanding what makes Bloxodachi feel like Bloxodachi, not just what it contains.<\u002Fp>\n        <p><strong>A note on naming:<\u002Fstrong> in code and in anything a player reads, the characters are <strong>always “Robloxians.”<\u002Fstrong> Never “residents,” “Miis,” or “NPCs.” This doc uses “Robloxians” the same way. It's a small rule that protects the brand from looking like a Tomodachi clone.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- §1 -->\n    <section class=\"s\" id=\"s1\">\n      <span class=\"s-tag\">§1 · THE GAME<\u002Fspan>\n      <h2>What Bloxodachi Life is<\u002Fh2>\n      <div class=\"card body-copy\">\n        <p>A god-view life simulator on Roblox, inspired by <em>Tomodachi Life: Living the Dream<\u002Fem>. The player is not an avatar in the world — they're an unseen presence above it, watching their island of Robloxians live, talk, eat, dream, form relationships, and grow. You add Robloxians, customize them from the Roblox catalog, give them voices and personalities, then nudge their lives along: feed them, answer their questions, drag two of them together to spark a friendship, watch a friendship turn into a romance and a romance turn into a wedding.<\u002Fp>\n        <p>It is <strong>cozy<\u002Fstrong> (low-stakes, no fail states, no timers breathing down your neck) and it is <strong>chaotic<\u002Fstrong> (Robloxians get hiccups, fall over, develop crushes you didn't plan, stand unbothered in front of hyper-realistic PNG backgrounds). That tension is the whole point.<\u002Fp>\n        <p style=\"color:var(--ink-mute); font-size:.92em\">Built solo on a Claude Opus + Codex stack. Organic growth — TikTok virality, word of mouth, and the Roblox algorithm surfacing the game off elite retention. This doc marks the transition from solo development to team-supported scaling.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"margin-top:28px\">The market gap it fills<\u002Fh3>\n      <div class=\"card\">\n        <p>Tomodachi-style life simulation had no major presence on Roblox, despite two proven adjacent genres: avatar-customization games regularly hit 50K–100K+ CCU, and life-sim games (Brookhaven, Adopt Me, Bloxburg) clear 100K+. Bloxodachi sits at the intersection — avatar customization plus life simulation, with <strong>social storytelling as the differentiating layer.<\u002Fstrong> Nobody else is doing the Tomodachi relationship system at scale on the platform.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- §2 -->\n    <section class=\"s\" id=\"s2\">\n      <span class=\"s-tag\">§2 · WHO IT'S FOR<\u002Fspan>\n      <h2>Target audience<\u002Fh2>\n      <div class=\"grid-2\">\n        <div class=\"card\">\n          <h4>🎨 Primary<\u002Fh4>\n          <p>Roblox players roughly <strong>10–18<\u002Fstrong>, with artistic and social interests. They make fanart, care about character expression, live in creative communities, and share content. TikTok has trained them for short loops — but they go <em>deep<\u002Fem> once a game earns it.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <h4>🌱 Secondary<\u002Fh4>\n          <p>Players <strong>18–30<\u002Fstrong> nostalgic for Tomodachi Life, Animal Crossing, and Chao Garden. Adults who want cozy gameplay with real depth.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"callout\" style=\"margin-top:18px\">\n        <h4>The read that matters<\u002Fh4>\n        <p>This audience is not “less capable” or “shorter attention.” They are <em>more selective<\u002Fem> about what earns engagement, and they engage harder than older audiences once hooked.<\u002Fp>\n        <p style=\"margin-top:10px\"><strong>Design implication:<\u002Fstrong> build deep features with smart onboarding. Shallow features built for an assumed short attention span will underperform. But — and this is the counterweight — a <em>simple<\u002Fem> feature with a real hook is often a huge win. Pets and the potion shop were both fast to build and both landed hard. Depth and simplicity aren't opposites here; the bar is “is there a real hook,” not “is it complicated.”<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- §3 PILLARS -->\n    <section class=\"s\" id=\"s3\">\n      <span class=\"s-tag\">§3 · THE FIVE<\u002Fspan>\n      <h2>Design pillars<\u002Fh2>\n      <p style=\"color:var(--ink-soft); margin-bottom:18px\">Every feature decision gets evaluated against these five. If a feature doesn't serve at least one, question it.<\u002Fp>\n      <div class=\"pillars\">\n        <div class=\"pillar p1\">\n          <div class=\"ico\">🌼<\u002Fdiv>\n          <h4>Cozy Chaos<\u002Fh4>\n          <p>Peaceful, low-stakes interaction balanced against absurd emergent moments. The player should feel safe and unhurried while regularly being surprised and delighted.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"pillar p2\">\n          <div class=\"ico\">💞<\u002Fdiv>\n          <h4>Meaningful Relationships Over Competition<\u002Fh4>\n          <p>The core is social simulation. Players invest in their Robloxians' relationships and stories. The Social Hub adds competition, but the heart is emotional attachment, not winning.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"pillar p3\">\n          <div class=\"ico\">🧑‍🎨<\u002Fdiv>\n          <h4>Customization Through the Roblox Catalog<\u002Fh4>\n          <p>Players express identity through the full catalog character creator. Robloxians are recognizably Roblox-native — deliberately <em>not<\u002Fem> the Mii aesthetic.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"pillar p4\">\n          <div class=\"ico\">📸<\u002Fdiv>\n          <h4>Sharable Absurdity<\u002Fh4>\n          <p>Built for the TikTok era. The Charm Contest, World Tour PNG backgrounds, resident chaos — these manufacture screenshot- and clip-worthy moments. Virality is baked in, not bolted on.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"pillar p5\">\n          <div class=\"ico\">💝<\u002Fdiv>\n          <h4>Voluntary Support, Not Pay-to-Win<\u002Fh4>\n          <p>Monetization frames spending as supporting the game and unlocking expression — never as buying competitive advantage. (Revisitable for multiplayer specifically, where the math changes.)<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- §4 SACRED / FLEXIBLE -->\n    <section class=\"s\" id=\"s4\">\n      <span class=\"s-tag\">§4 · GUARDRAILS<\u002Fspan>\n      <h2>What's sacred · what's flexible<\u002Fh2>\n      <p style=\"color:var(--ink-soft); margin-bottom:18px\">New contributors should know where they have room to move and where they need to check in first.<\u002Fp>\n\n      <div class=\"sf\">\n        <div class=\"sf-col sacred\">\n          <h3>🔒 Sacred<\u002Fh3>\n          <div class=\"head-note\">Don't change without an explicit decision.<\u002Fdiv>\n          <div class=\"tag-list\">\n            <span class=\"t\">God-view camera (no character)<\u002Fspan>\n            <span class=\"t\">Roblox catalog customization<\u002Fspan>\n            <span class=\"t\">Brand voice &amp; tone<\u002Fspan>\n            <span class=\"t\">Cozy–chaos balance<\u002Fspan>\n            <span class=\"t\">Voluntary-support monetization<\u002Fspan>\n            <span class=\"t\">Original IP positioning<\u002Fspan>\n            <span class=\"t\">No Nintendo asset mimicry<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:.85rem; color:var(--ink-soft); margin-top:14px\">God-view may be revisited for silly events / 4th-wall breaks. Gacha-style mechanics are acceptable inside the voluntary-support philosophy.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"sf-col flex\">\n          <h3>🌿 Flexible<\u002Fh3>\n          <div class=\"head-note\">Team contribution actively welcomed.<\u002Fdiv>\n          <div class=\"tag-list\">\n            <span class=\"t\">Mobile UX &amp; controls<\u002Fspan>\n            <span class=\"t\">Visual polish &amp; UI (→ Stardew)<\u002Fspan>\n            <span class=\"t\">Performance optimization<\u002Fspan>\n            <span class=\"t\">Content velocity<\u002Fspan>\n            <span class=\"t\">Onboarding for Tomodachi-new players<\u002Fspan>\n            <span class=\"t\">Marketing copy execution<\u002Fspan>\n            <span class=\"t\">Mechanics inside the roadmap<\u002Fspan>\n            <span class=\"t\">Backend infrastructure &amp; tooling<\u002Fspan>\n            <span class=\"t\">Community moderation<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- §5 -->\n    <section class=\"s\" id=\"s5\">\n      <span class=\"s-tag\">§5 · POSITIONING<\u002Fspan>\n      <h2>Strategic positioning &amp; inspirations<\u002Fh2>\n\n      <h3>Reference class<\u002Fh3>\n      <table class=\"ref-table\" style=\"margin-bottom:18px\">\n        <thead><tr><th>Class<\u002Fth><th>Examples<\u002Fth><th>CCU range<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Avatar customization<\u002Ftd><td>Catalog Avatar Creator, Dress to Impress<\u002Ftd><td>50K–100K+<\u002Ftd><\u002Ftr>\n          <tr><td>Life simulation<\u002Ftd><td>Brookhaven, Adopt Me, Bloxburg<\u002Ftd><td>100K+<\u002Ftd><\u002Ftr>\n          <tr><td>Cozy (off-platform, aesthetic ref)<\u002Ftd><td>Animal Crossing, Stardew Valley<\u002Ftd><td>—<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <div class=\"callout\">\n        <h4>Long-term vision<\u002Fh4>\n        <p>The definitive life sim on Roblox. Tomodachi Life took Nintendo ~9 years to reach its final depth. Bloxodachi with team support can reach comparable depth in <strong>2–3 years<\u002Fstrong>. This is a multi-year project with a long content runway, not a flash hit to be milked.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"margin-top:24px\">Intentional inspirations<\u002Fh3>\n      <div class=\"insp-grid\">\n        <div class=\"insp\">\n          <div class=\"from\">Nintendo<\u002Fdiv>\n          <h4>Tomodachi Life<\u002Fh4>\n          <p>The core relationship system, personalities, drag-and-drop interactions, cute-chaos energy. Design intent borrowed; assets and branding deliberately not.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"insp\">\n          <div class=\"from\">Sega · Sonic Adventure 2: Battle<\u002Fdiv>\n          <h4>Chao Garden<\u002Fh4>\n          <p>Direct inspiration for the Social Hub. Invest in a character through normal play, then bring them to compete in mini-games. That loop is what the Social Hub recreates.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"insp\">\n          <div class=\"from\">Nintendo<\u002Fdiv>\n          <h4>Animal Crossing<\u002Fh4>\n          <p>Cozy aesthetic, animalese-style voices, seasonal/event content, low-stakes daily loops.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"insp\">\n          <div class=\"from\">ConcernedApe<\u002Fdiv>\n          <h4>Stardew Valley<\u002Fh4>\n          <p>Visual direction (the UI redesign moves this way), respect for player time, generous updates, indie ethos.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"insp\">\n          <div class=\"from\">Web · Discord<\u002Fdiv>\n          <h4>Picrew / Strawpage / card bots<\u002Fh4>\n          <p>Reference for the Bloxodachi Cards feature (§7): attaching social value to a customizable identity object.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"insp\">\n          <div class=\"from\">Mojang<\u002Fdiv>\n          <h4>Minecraft<\u002Fh4>\n          <p>The buildable, block-based grid for the Wandering Merchant and housing island.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <blockquote style=\"margin-top:18px\">On animalese: the current animalese-style voice came partly from voice-engine constraints. A custom dulcet TTS voice engine is a possible future direction depending on where we take audio.<\u002Fblockquote>\n    <\u002Fsection>\n\n    <!-- §6 ROADMAP -->\n    <section class=\"s\" id=\"s6\">\n      <span class=\"s-tag\">§6 · CENTERPIECE<\u002Fspan>\n      <h2>The roadmap<\u002Fh2>\n      <p style=\"color:var(--ink-soft); margin-bottom:18px; max-width:70ch\">This is the public roadmap as published to the community. <strong>Preserve the voice and structure when republishing<\u002Fstrong>; develop technical specs separately. Each block is a feature <em>category<\u002Fem> that still needs spec with the team. The internal phase tracker (<code>docs/PLAN.md<\u002Fcode>) is the source of truth for status.<\u002Fp>\n\n      <div class=\"roadmap\">\n\n        <!-- LIVE -->\n        <div class=\"lane live\">\n          <div class=\"lane-head\">\n            <span class=\"lane-pill\"><span class=\"lp-ico\">✅<\u002Fspan>Live<span class=\"lp-count\">15 shipped<\u002Fspan><\u002Fspan>\n            <div class=\"lane-rule\"><\u002Fdiv>\n            <div class=\"lane-note\">In players' hands. Patch territory, not greenfield.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"feat-row dense\">\n            <div class=\"feat\"><span class=\"emoji\">🧍<\u002Fspan><span class=\"ttl\">Robloxian creation<\u002Fspan><\u002Fdiv>\n            <div class=\"feat\"><span class=\"emoji\">🔊<\u002Fspan><span class=\"ttl\">Animalese voice + chatter<\u002Fspan><\u002Fdiv>\n            <div class=\"feat\"><span class=\"emoji\">💭<\u002Fspan><span class=\"ttl\">Mood &amp; stats loop<\u002Fspan><\u002Fdiv>\n            <div class=\"feat\"><span class=\"emoji\">💬<\u002Fspan><span class=\"ttl\">Events &amp; bubbles<\u002Fspan><\u002Fdiv>\n            <div class=\"feat\"><span class=\"emoji\">🚶<\u002Fspan><span class=\"ttl\">Activity loop<\u002Fspan><\u002Fdiv>\n            <div class=\"feat\"><span class=\"emoji\">💖<\u002Fspan><span class=\"ttl\">Relationship ladder (10+ stages)<\u002Fspan><\u002Fdiv>\n            <div class=\"feat\"><span class=\"emoji\">🖐️<\u002Fspan><span class=\"ttl\">Drag-and-drop influence<\u002Fspan><\u002Fdiv>\n            <div class=\"feat\"><span class=\"emoji\">🐾<\u002Fspan><span class=\"ttl\">Pets<\u002Fspan><\u002Fdiv>\n            <div class=\"feat\"><span class=\"emoji\">🧪<\u002Fspan><span class=\"ttl\">Potion line<\u002Fspan><\u002Fdiv>\n            <div class=\"feat\"><span class=\"emoji\">🎁<\u002Fspan><span class=\"ttl\">Treasure mystery bags<\u002Fspan><\u002Fdiv>\n            <div class=\"feat\"><span class=\"emoji\">🌗<\u002Fspan><span class=\"ttl\">Day / night cycle<\u002Fspan><\u002Fdiv>\n            <div class=\"feat\"><span class=\"emoji\">🏆<\u002Fspan><span class=\"ttl\">Leaderboards<\u002Fspan><\u002Fdiv>\n            <div class=\"feat\"><span class=\"emoji\">💝<\u002Fspan><span class=\"ttl\">Heart Shop<\u002Fspan><\u002Fdiv>\n            <div class=\"feat\"><span class=\"emoji\">🦴<\u002Fspan><span class=\"ttl\">SANS easter-egg event<\u002Fspan><\u002Fdiv>\n            <div class=\"feat\"><span class=\"emoji\">📱<\u002Fspan><span class=\"ttl\">Mobile control pass<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- IN FLIGHT -->\n        <div class=\"lane flight\">\n          <div class=\"lane-head\">\n            <span class=\"lane-pill\"><span class=\"lp-ico\">🔧<\u002Fspan>In Flight<span class=\"lp-count\">3 active<\u002Fspan><\u002Fspan>\n            <div class=\"lane-rule\"><\u002Fdiv>\n            <div class=\"lane-note\">Polish &amp; depth on shipped systems.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"feat-row\">\n            <div class=\"feat\">\n              <span class=\"emoji\">🔁<\u002Fspan>\n              <span class=\"ttl\">Activity-loop polish<\u002Fspan>\n              <div class=\"desc\">Cadence, variety. Background activities stay <em>flavor<\u002Fem>, never progression.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"feat\">\n              <span class=\"emoji\">🪄<\u002Fspan>\n              <span class=\"ttl\">Deeper relationship influence<\u002Fspan>\n              <div class=\"desc\">More ways for players to <em>earn<\u002Fem> progression — never an auto-popup.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"feat\">\n              <span class=\"emoji\">🛍️<\u002Fspan>\n              <span class=\"ttl\">Potion apply-flow storefront<\u002Fspan>\n              <div class=\"desc\">Cleaner UX from purchase → effect on a chosen Robloxian.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- NEXT -->\n        <div class=\"lane next\">\n          <div class=\"lane-head\">\n            <span class=\"lane-pill\"><span class=\"lp-ico\">🔜<\u002Fspan>Next<span class=\"lp-count\">forward arc<\u002Fspan><\u002Fspan>\n            <div class=\"lane-rule\"><\u002Fdiv>\n            <div class=\"lane-note\">The next major slices.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"feat-row\">\n\n            <div class=\"feat-hero\">\n              <div class=\"hero-ico\">🏠<\u002Fdiv>\n              <div>\n                <h4>Houses + Island Builder<\u002Fh4>\n                <p>The next major slice. Separate builder place, grid-first mobile editing.<\u002Fp>\n                <div class=\"sub\">\n                  <span class=\"chip\">separate place<\u002Fspan>\n                  <span class=\"chip\">grid-first<\u002Fspan>\n                  <span class=\"chip\">mobile-priority<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"feat\">\n              <span class=\"emoji\">🌟<\u002Fspan>\n              <span class=\"ttl\">The God Realm — Sky Island<\u002Fspan>\n              <div class=\"desc\">A cloud island that grows as you play. Starts bare, grows with you, entirely yours.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"feat\">\n              <span class=\"emoji\">🕯️<\u002Fspan>\n              <span class=\"ttl\">The Altar<\u002Fspan>\n              <div class=\"desc\">Daily baking recipe reveals — a check-in hook.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"feat\">\n              <span class=\"emoji\">🏛️<\u002Fspan>\n              <span class=\"ttl\">The Museum<\u002Fspan>\n              <div class=\"desc\">Every fish, treasure, and relationship milestone, commemorated.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"feat\">\n              <span class=\"emoji\">🏆<\u002Fspan>\n              <span class=\"ttl\">Trophy Hall<\u002Fspan>\n              <div class=\"desc\">Wins, rare finds, founder status. Legacy lives here.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"feat\">\n              <span class=\"emoji\">⚡<\u002Fspan>\n              <span class=\"ttl\">The Social Hub<\u002Fspan>\n              <div class=\"desc quote\">“your residents found a router. it fell from the sky. nobody is asking questions. they plugged it in.”<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"feat\">\n              <span class=\"emoji\">🏃<\u002Fspan>\n              <span class=\"ttl\">Agility Race<\u002Fspan>\n              <div class=\"desc\">Obstacle course. Fastest Robloxian wins.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"feat\">\n              <span class=\"emoji\">💪<\u002Fspan>\n              <span class=\"ttl\">Strength Competition<\u002Fspan>\n              <div class=\"desc\">Tug of war, arm wrestling, general chaos.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"feat\">\n              <span class=\"emoji\">✨<\u002Fspan>\n              <span class=\"ttl\">Charm Contest<\u002Fspan>\n              <div class=\"desc\">Your Robloxian gives a speech. Quality depends on their social stat. Results vary wildly. Screenshots encouraged.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"feat\">\n              <span class=\"emoji\">🎵<\u002Fspan>\n              <span class=\"ttl\">Singing &amp; Concerts<\u002Fspan>\n              <div class=\"desc\">Concerts coming to the island. (3DS Tomodachi fan-favorite.)<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"feat\">\n              <span class=\"emoji\">🌍<\u002Fspan>\n              <span class=\"ttl\">World Tour Expansion<\u002Fspan>\n              <div class=\"desc quote\">Robloxians travel the world and stand, completely unbothered, in front of hyper-realistic PNG backgrounds. Keep an eye on the backgrounds — something may be watching.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"feat\">\n              <span class=\"emoji\">🎭<\u002Fspan>\n              <span class=\"ttl\">Personalities, expanded<\u002Fspan>\n              <div class=\"desc\">Personality type reflected in posture, idle behavior, unique dialogue lines. Paid personality packs — <em>the Romantic<\u002Fem>, <em>the Troublemaker<\u002Fem>, <em>the Wildcard<\u002Fem>, <em>the Brainrotter<\u002Fem>.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"feat\">\n              <span class=\"emoji\">📮<\u002Fspan>\n              <span class=\"ttl\">Island Visiting &amp; Town Board<\u002Fspan>\n              <div class=\"desc\">Animal-Crossing-inspired. Residents and players leave notes on your island. <strong>Snapshot-based<\u002Fstrong>, not live visits — flexes to whatever multiplayer looks like at the time.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"feat\">\n              <span class=\"emoji\">🪪<\u002Fspan>\n              <span class=\"ttl\">Bloxodachi Cards MVP<\u002Fspan>\n              <div class=\"desc\">Photo Booth → backend → public profile pages. (See §7.)<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- NORTH STAR -->\n        <div class=\"lane north\">\n          <div class=\"lane-head\">\n            <span class=\"lane-pill\"><span class=\"lp-ico\">🌟<\u002Fspan>North Star<span class=\"lp-count\">the horizon<\u002Fspan><\u002Fspan>\n            <div class=\"lane-rule\"><\u002Fdiv>\n            <div class=\"lane-note\">Where current work is quietly heading.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"feat-row\">\n\n            <div class=\"feat-hero\">\n              <div class=\"hero-ico\">🎬<\u002Fdiv>\n              <div>\n                <h4>Player-authored “fanfic” scenes<\u002Fh4>\n                <p>Turn the cutscene engine into a player-facing creation tool. Players stage their own Robloxians in their own scenes — fan-fiction authored inside the engine that already exists.<\u002Fp>\n                <div class=\"sub\">\n                  <span class=\"chip\">place → pose → line → camera<\u002Fspan>\n                  <span class=\"chip\">save &amp; share<\u002Fspan>\n                  <span class=\"chip\">moderation non-negotiable<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"feat\">\n              <span class=\"emoji\">🤖<\u002Fspan>\n              <span class=\"ttl\">Cards Phase 2 — Discord bot<\u002Fspan>\n              <div class=\"desc\">Renders cards in Discord. Collection / trading-style social on the same backend.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"feat\">\n              <span class=\"emoji\">🔁<\u002Fspan>\n              <span class=\"ttl\">Cards Phase 3 — feedback loop<\u002Fspan>\n              <div class=\"desc\">Web / Discord actions feed back into the game.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"feat\">\n              <span class=\"emoji\">🌐<\u002Fspan>\n              <span class=\"ttl\">Multiplayer / split-island<\u002Fspan>\n              <div class=\"desc\">Deferred, not abandoned. 8-player, spectate-only. Solo loop has to earn it.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"feat\">\n              <span class=\"emoji\">🗣️<\u002Fspan>\n              <span class=\"ttl\">Custom dulcet TTS voice<\u002Fspan>\n              <div class=\"desc\">Animalese is a placeholder. Direction depends on where we take audio.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 6.1 worked example -->\n      <div class=\"callout\" style=\"margin-top:22px\">\n        <h4>§6.1 · How “never the only path” holds — a worked example<\u002Fh4>\n        <p>A romance system that also sells a Love Potion invites an obvious worry: does spending quietly become the <em>real<\u002Fem> path to marriage? It doesn't, and the code is deliberately built to keep it that way.<\u002Fp>\n        <p><strong>Robloxians fall in love for free.<\u002Fstrong> The <code>CrushSpark<\u002Fcode> event is a thought bubble that fires organically (~3% of special-event rolls, tuned up so it's discoverable) with <strong>no relationship-stage gate<\u002Fstrong> — any mutually-interested pair can spark, even strangers. The player taps <strong>“It might be. Go talk to them,”<\u002Fstrong> and the romance begins; milestone cutscenes (Beach Run → Stargaze → Proposal → Wedding) carry the pair to marriage.<\u002Fp>\n        <p><strong>The Love Potion accelerates, it never gates.<\u002Fstrong> It advances an eligible pair one romantic stage and plays that stage's cutscene — a player who never spends still reaches a wedding by playing. That ordering — free path first, paid acceleration second — is the rule every future monetized system should follow.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- 6.2 / 6.3 quick blocks -->\n      <div class=\"grid-2\" style=\"margin-top:18px\">\n        <div class=\"card\">\n          <h3>§6.2 · Singleplayer-first<\u002Fh3>\n          <p>The original vision included <strong>multiplayer<\u002Fstrong>: an 8-player split-island scheme with spectate-only access to other islands. We deliberately shipped <strong>singleplayer-first<\u002Fstrong> — not as a permanent constraint, but as sequencing. The core life-sim loop has to be genuinely fun for one player before a shared world is worth the complexity.<\u002Fp>\n          <p>“Singleplayer” describes the <em>island sim<\u002Fem>, not the whole game. Cross-player social is already arriving through the <strong>Social Hub<\u002Fstrong> and <strong>Bloxodachi Cards<\u002Fstrong> (§7).<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"background: linear-gradient(180deg, #fff5e8, #fff0d6); border-color:#e8c878\">\n          <h3>§6.3 · The north star — fanfic scenes<\u002Fh3>\n          <p>Why it's the right north star:<\u002Fp>\n          <ul>\n            <li><strong>It's the in-engine version of what the audience already does<\u002Fstrong> (fanart, fanfic). A scene authoring tool is that impulse made native.<\u002Fli>\n            <li><strong>It's maximally shareable<\u002Fstrong> — pairs naturally with Cards (§7).<\u002Fli>\n            <li><strong>The hard infrastructure is already built.<\u002Fstrong> We're maturing an engine, not inventing one.<\u002Fli>\n          <\u002Ful>\n          <p style=\"font-size:.88em; color:var(--ink-soft); margin-top:10px\">Treat as destination, not backlog. Every improvement to poses, camera presets, and the beat runner is an investment in this endgame.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 style=\"margin-top:28px\">§6.4 · Success metrics<\u002Fh3>\n      <div class=\"grid-3\">\n        <div class=\"card\">\n          <div class=\"s-tag\" style=\"background:#e6efd2; border-color:#b9d199; color:#3f5e2f\">Next 90 days<\u002Fdiv>\n          <ul>\n            <li>New Player Experience revamp<\u002Fli>\n            <li>Houses + Island Builder<\u002Fli>\n            <li>UI redesign<\u002Fli>\n            <li>Full catalog character creator<\u002Fli>\n            <li>Relationship depth<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <div class=\"s-tag\" style=\"background:#d8e6f1; border-color:#a5c4dc; color:#2c5a82\">6 months<\u002Fdiv>\n          <ul>\n            <li>Top life-sim positioning on Roblox<\u002Fli>\n            <li>Social Hub launched<\u002Fli>\n            <li>Cards MVP launched<\u002Fli>\n            <li>Multi-platform community (Discord, TikTok, web)<\u002Fli>\n            <li>Sustainable team velocity<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <div class=\"s-tag\" style=\"background:#e4d9ee; border-color:#bca5d4; color:#5a3b85\">12–24 months<\u002Fdiv>\n          <ul>\n            <li>Category-defining hit<\u002Fli>\n            <li>Content depth approaching Tomodachi Life's 9-year arc<\u002Fli>\n            <li>Discord bot live<\u002Fli>\n            <li>Brand established beyond the Roblox game itself<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- §7 CARDS -->\n    <section class=\"s\" id=\"s7\">\n      <span class=\"s-tag\">§7 · FLAGSHIP FEATURE · pre-build<\u002Fspan>\n      <h2>Bloxodachi Cards / Pages<\u002Fh2>\n      <p style=\"color:var(--ink-soft); max-width:70ch\">The “turn attachment into portable identity” feature. A player takes a Robloxian they love, generates a card for them in-game, and that card becomes a public, shareable object — a profile page on the web, a card a Discord bot can render, a thing you post.<\u002Fp>\n\n      <div class=\"callout\" style=\"margin-top:14px\">\n        <h4>Why it fits the pillars<\u002Fh4>\n        <ul style=\"margin-bottom:0\">\n          <li><strong>Sharable Absurdity:<\u002Fstrong> a card is the most natively-shareable artifact the game can produce.<\u002Fli>\n          <li><strong>Meaningful Relationships:<\u002Fstrong> emotional attachment extends past the session — your Robloxian exists <em>outside<\u002Fem> the game now.<\u002Fli>\n          <li><strong>Customization:<\u002Fstrong> another expression surface; pulls identity value out of catalog work the player already did.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <h3 style=\"margin-top:28px\">Phased build<\u002Fh3>\n      <div class=\"phases\" style=\"margin-top:22px\">\n        <div class=\"phase\">\n          <span class=\"tag-step\">MVP<\u002Fspan>\n          <h4>📸 Photo Booth + backend + pages<\u002Fh4>\n          <ul>\n            <li>In-game <strong>Photo Booth<\u002Fstrong> — pick, pose, frame, generate.<\u002Fli>\n            <li>Reuses god-view camera + ViewportFrame portrait infra.<\u002Fli>\n            <li>Backend storage keyed to player + Robloxian (external service from the start).<\u002Fli>\n            <li>Public profile pages — shareable by link, screenshot-friendly.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"phase\">\n          <span class=\"tag-step\">Phase 2<\u002Fspan>\n          <h4>🤖 Discord bot integration<\u002Fh4>\n          <ul>\n            <li>Bot renders cards in Discord.<\u002Fli>\n            <li>Supports collection / trading-style social mechanics.<\u002Fli>\n            <li>Reads from the same backend the web pages do.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"phase\">\n          <span class=\"tag-step\">Phase 3<\u002Fspan>\n          <h4>🔁 Game ↔ web ↔ game feedback loop<\u002Fh4>\n          <ul>\n            <li>Web / Discord actions feed back into the game.<\u002Fli>\n            <li>Candidates: redeemables, web-side customization that appears in-game, social signals surfaced on the island.<\u002Fli>\n            <li>Exact mechanics TBD.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"grid-2\" style=\"margin-top:22px\">\n        <div class=\"card\">\n          <h3>§7.4 · Monetization hooks <span style=\"font-size:.7em; color:var(--ink-mute); font-weight:normal\">— later, not MVP<\u002Fspan><\u002Fh3>\n          <p>Per the “follow attachment, not precede it” rule (§8): ship the loop free first, prove players make and share cards, <em>then<\u002Fem> layer premium.<\u002Fp>\n          <div class=\"tag-list\">\n            <span class=\"t\">Seasonal / event card frames<\u002Fspan>\n            <span class=\"t\">Premium card effects<\u002Fspan>\n            <span class=\"t\">Rare backgrounds<\u002Fspan>\n            <span class=\"t\">Discord bot cosmetics<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"background:#fff5d8; border-color:#e8c878\">\n          <h3>§7.5 · Open questions for the team<\u002Fh3>\n          <ul>\n            <li>Where does the card backend live, and how does it authenticate against Roblox identity?<\u002Fli>\n            <li><strong>Moderation<\u002Fstrong> — cards are user-generated and public-facing. All card text must pass moderation before leaving the game; the web layer needs its own gate too.<\u002Fli>\n            <li>How much of the card is auto-generated from the Robloxian vs. player-decorated?<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- §8 MONETIZATION -->\n    <section class=\"s\" id=\"s8\">\n      <span class=\"s-tag\">§8 · PHILOSOPHY<\u002Fspan>\n      <h2>Monetization philosophy<\u002Fh2>\n      <div class=\"callout\">\n        <h4>The rule<\u002Fh4>\n        <p style=\"font-size:1.05rem\"><strong>Monetization follows attachment. It never precedes it.<\u002Fstrong> Build the engagement loop, prove players want in, <em>then<\u002Fem> introduce optional premium layers. This is not a moral position alone — it's what the data has rewarded.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"mon-grid\" style=\"margin-top:18px\">\n        <div class=\"mon-list\">\n          <h4>✅ What's working<\u002Fh4>\n          <ul>\n            <li><strong>Founders Pass<\u002Fstrong> — recognition-based; players supporting the game's success.<\u002Fli>\n            <li><strong>Potions / items<\u002Fstrong> — functional but optional; enhance expression, never gate progression.<\u002Fli>\n            <li><strong>Milestone promo codes<\u002Fstrong> — build goodwill, reward the engaged community.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"principles\">\n          <h4>Principles<\u002Fh4>\n          <ul>\n            <li>Never gate core gameplay behind a paywall.<\u002Fli>\n            <li>Limited-time items create urgency without forcing an immediate buy.<\u002Fli>\n            <li><strong>Don't fake urgency.<\u002Fstrong> A permanent Game Pass should not wear a “LIMITED TIME” badge — we removed one for exactly this reason.<\u002Fli>\n            <li>Premium items should feel like collectibles or status symbols, not power upgrades.<\u002Fli>\n            <li>Discounted “founders” / “milestone” packs at significant moments work well.<\u002Fli>\n            <li>Free rewards for everyone, alongside premium options, maintains goodwill.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"callout\" style=\"margin-top:18px\">\n        <h4>A worked example in code<\u002Fh4>\n        <p>When every Robloxian slot is full, the game shows a soft “Island full — tap to make more room” nudge that opens the Heart Shop, hidden for players who already own the More Friends Pass. The instinct in a lesser game would be to <em>nerf progression<\u002Fem> to manufacture that pressure — which would punish the most engaged players, who are exactly the monetization funnel. Instead we convert the <em>natural<\u002Fem> friction point and leave progression generous.<\u002Fp>\n        <p style=\"margin-top:8px\"><strong>That's the philosophy made concrete:<\u002Fstrong> pressure comes from real ceilings, never from artificial pain.<\u002Fp>\n      <\u002Fdiv>\n\n      <p style=\"color:var(--ink-mute); font-size:.92rem; margin-top:14px\"><em>Future opportunities (not now):<\u002Fem> seasonal card frames (§7.4), premium card effects, earnable + premium housing decoration, limited Wandering Merchant exclusives, Discord bot cosmetics.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- §9 TECH — MUTED FOR ENGINEERS -->\n    <section class=\"s\" id=\"s9\">\n      <div class=\"tech-wrap\">\n        <span class=\"for-engineers\">⚙️ For engineers · safe to skip<\u002Fspan>\n        <h2 style=\"margin-top:6px\">§9 — Technical architecture overview<\u002Fh2>\n        <p class=\"skip-note\">Non-tech readers: this section is the orientation layer for engineers — system shape, code paths, and the gotchas that have actually bitten us. You can skip it without missing any product context.<\u002Fp>\n\n        <p>Full detail lives in the codebase, <code>docs/SYSTEM_MAP.md<\u002Fcode>, and <code>docs/COLLAB.md<\u002Fcode>. New engineers: read SYSTEM_MAP and COLLAB before touching the relationship, stats, or cutscene systems — they have hard-won invariants that are easy to violate.<\u002Fp>\n\n        <h3>9.1 — Shape of the project<\u002Fh3>\n        <ul>\n          <li><strong>Roblox + Rojo.<\u002Fstrong> Code lives in this repo and syncs into Studio. <code>*.server.lua<\u002Fcode> → <code>Script<\u002Fcode>, <code>*.client.lua<\u002Fcode> → <code>LocalScript<\u002Fcode>, plain <code>*.lua<\u002Fcode> → <code>ModuleScript<\u002Fcode>. Tabs for indentation.<\u002Fli>\n          <li><strong>Service properties belong in <code>default.project.json<\u002Fcode> <code>$properties<\u002Fcode>, not scripts.<\u002Fstrong> Setting <code>Workspace.StreamingEnabled<\u002Fcode> or <code>Lighting.Technology<\u002Fcode> from a script throws a capability error and halts the script. Single most common environment trap.<\u002Fli>\n        <\u002Ful>\n\n        <table class=\"ttbl\">\n          <thead><tr><th>Area<\u002Fth><th>Path<\u002Fth><th>Holds<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td>Shared modules<\u002Ftd><td><code>src/ReplicatedStorage/Shared/<\u002Fcode><\u002Ftd><td><code>GameConfig<\u002Fcode>, <code>Relationships<\u002Fcode>, <code>Personalities<\u002Fcode>, <code>Activities<\u002Fcode>, <code>RobloxianEvents<\u002Fcode>, <code>Items<\u002Fcode>, <code>Treasure<\u002Fcode>, <code>Potions<\u002Fcode>, <code>Pets<\u002Fcode>, <code>BloxodachiDialogue<\u002Fcode>, <code>CutsceneEngine<\u002Fcode>, <code>ScriptedPoses<\u002Fcode>, <code>DulcetVoice<\u002Fcode>…<\u002Ftd><\u002Ftr>\n            <tr><td>Server<\u002Ftd><td><code>src/ServerScriptService/<\u002Fcode><\u002Ftd><td>Authority. <code>Bootstrap<\u002Fcode>, <code>Services/*<\u002Fcode>, behavior scripts (<code>RobloxianIdle<\u002Fcode>/<code>Inspect<\u002Fcode>/<code>Drag<\u002Fcode>/<code>Gifting<\u002Fcode>), <code>Cutscenes/*<\u002Fcode> scene definitions.<\u002Ftd><\u002Ftr>\n            <tr><td>Client<\u002Ftd><td><code>src/StarterPlayer/StarterPlayerScripts/<\u002Fcode><\u002Ftd><td>All UI and presentation: Camera, MobileJoystick, HUD, inspect/creation UIs, RelationshipUI, CutsceneClient, speech, lighting tweens, shop UIs.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n\n        <h3>9.2 — The architectural spine<\u002Fh3>\n        <details open=\"\">\n          <summary>God-view, no character<\u002Fsummary>\n          <p><code>Players.CharacterAutoLoads = false<\u002Fcode>. Camera in <code>Camera.client.lua<\u002Fcode> is fully scriptable: angled top-down, WASD/edge pan, scroll zoom, RMB rotate, clamped to the island. Because there is no character, the mobile joystick is <strong>custom<\u002Fstrong> — Roblox's native DynamicThumbstick is character-control UI and won't render reliably here. <em>(Player-tested decision: joystick is deliberately the default; earlier swipe-to-pan primary was found “way too hard.” Fix bugs; don't re-propose swipe-primary.)<\u002Fem><\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary>The world rebuilds on every server start<\u002Fsummary>\n          <p><code>IslandWorld.Build()<\u002Fcode> destroys and recreates <code>Workspace.BloxodachiIsland<\u002Fcode>. Do not add persistence to the world folder. Island can be generated or authored (<code>MainIsland<\u002Fcode> / <code>SakuraIsland<\u002Fcode>); authored islands are detected and preserved, system reads <code>EventMarker…<\u002Fcode> parts for activity locations.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary>Server is the only writer of state<\u002Fsummary>\n          <p>Every Robloxian's stats live in <code>profile.RuntimeState<\u002Fcode> server-side. Clients render from remote payloads and never mutate authoritative state. <strong>Critical invariant:<\u002Fstrong> if a remote claims to own multiple slices of state, it must populate <em>all<\u002Fem> of them — or send a deliberately partial payload that the client's nil-guards skip. A stale full snapshot wipes freshly-displayed values.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary>Persistence is centralized in <code>SessionPersistenceService<\u002Fcode><\u002Fsummary>\n          <p>Robloxian profiles, player inventory, purchases, Word Bank, island level/progress, unlock claims all export/import through it. Shops don't persist stock (deterministic from UTC day index). Studio runs with persistence off (writes to <code>_Studio<\u002Fcode> suffix); live servers always persist.<\u002Fp>\n        <\u002Fdetails>\n\n        <h3>9.3 — Key gameplay systems (one line each)<\u002Fh3>\n        <ul>\n          <li><strong>Robloxians<\u002Fstrong> — forced R15 for reliable catalog animation; intentionally oversized (~1.75×). Appearance mixes <code>HumanoidDescription<\u002Fcode> fields with a generated face-feature <code>SurfaceGui<\u002Fcode>.<\u002Fli>\n          <li><strong>Voice<\u002Fstrong> — animalese-style letter chirps (<code>DulcetVoice<\u002Fcode>); all speech flows through one <code>RobloxianSpoke<\u002Fcode> event.<\u002Fli>\n          <li><strong>Stats &amp; mood<\u002Fstrong> — Hunger drains slowly. <strong>Happiness is the visible level meter<\u002Fstrong> — no separate EXP. Raising Happiness grants equal Coins through the single <code>AwardHappiness<\u002Fcode> path.<\u002Fli>\n          <li><strong>Activities<\u002Fstrong> — weighted scheduler; solo + multi-actor. <strong>Background activities are flavor only — they never award relationship points.<\u002Fstrong><\u002Fli>\n          <li><strong>Relationships<\u002Fstrong> — 10+ stage ladder in <code>Relationships.lua<\u002Fcode>, data-only so stages insert cleanly. <strong>Progression is player-engaged only.<\u002Fstrong><\u002Fli>\n          <li><strong>Events / bubbles<\u002Fstrong> — head bubbles are “something's on my mind” indicators; engagement happens via normal click flow.<\u002Fli>\n          <li><strong>Cutscenes<\u002Fstrong> — data-driven beat runner (<code>CutsceneEngine<\u002Fcode> + <code>Cutscenes/*<\u002Fcode>). <strong>Animations run client-side<\u002Fstrong> (server <code>LoadAnimation<\u002Fcode> doesn't replicate reliably for non-character models); rig-stability fix is anchoring only the <code>HumanoidRootPart<\u002Fcode>.<\u002Fli>\n          <li><strong>Monetization plumbing<\u002Fstrong> — <code>GameConfig.Monetization.Products<\u002Fcode>, <code>MarketplaceReceipts<\u002Fcode> for <code>ProcessReceipt<\u002Fcode> (saves before acknowledging), Heart Shop, “Coming Soon” disabled state for any product whose dashboard ID isn't pasted yet.<\u002Fli>\n        <\u002Ful>\n\n        <h3>9.4 — Things that will bite you<\u002Fh3>\n        <details>\n          <summary>Don't chase Robloxian head-lag / walking choppiness for V1<\u002Fsummary>\n          <p>Deeply investigated. Root cause is live-humanoid CFrame replication with no client interpolation, plus catalog-heavy avatars. SLIM/streaming was tested and made it <em>worse<\u002Fem>; RenderFidelity is plugin-locked. Shipped mitigation is camera-aware visual LOD. Real fix is client-side animation/interpolation — a project, not a patch.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary>A live-place backdoor rode in on free models once<\u002Fsummary>\n          <p><code
