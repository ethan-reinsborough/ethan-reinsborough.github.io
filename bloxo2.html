>WorkspaceScriptGuard<\u002Fcode> nukes any script that appears in Workspace. Be careful importing asset packs.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary>Don't tween lighting server-side<\u002Fsummary>\n          <p>Clients won't see smooth interpolation. Day/night is split: <code>DayNightService<\u002Fcode> owns <code>Lighting.ClockTime<\u002Fcode>, <code>DayNightLighting.client.lua<\u002Fcode> owns all visual tweens. God-view makes <code>OutdoorAmbient<\u002Fcode> and <code>ExposureCompensation<\u002Fcode> matter more than usual.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary>User text must pass <code>TextModerationService<\u002Fcode><\u002Fsummary>\n          <p>Before it's saved or shown to another player. Applies to Robloxian names, Word Bank entries, and anything new that's player-authored (island names, captions, card text).<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary>The Clothes Shop is being retired<\u002Fsummary>\n          <p>Being repurposed (likely as the Potion Stand). Don't wire new monetization to <code>VipClothingService<\u002Fcode> / <code>Items.VipCatalog<\u002Fcode>. Codex currently owns the creator rework (<code>RobloxianCreation.*<\u002Fcode>) — coordinate before touching it.<\u002Fp>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- §10 -->\n    <section class=\"s\" id=\"s10\">\n      <span class=\"s-tag\">§10 · WORKFLOW<\u002Fspan>\n      <h2>How we work<\u002Fh2>\n      <p style=\"color:var(--ink-soft); max-width:70ch\">How to work effectively with the founder and alongside the AI dev stack.<\u002Fp>\n\n      <h3 style=\"margin-top:22px\">§10.1 · Decision-making operating system<\u002Fh3>\n      <p>The founder's system that built this game: <strong>Trend Recognition + Execution Speed + Iteration Off Analytics.<\u002Fstrong> Run decisions through five questions:<\u002Fp>\n      <ol class=\"ol-num\">\n        <li><div><strong>What is the data telling us?<\u002Fstrong> Retention, CCU, monetization, ratings.<\u002Fdiv><\u002Fli>\n        <li><div><strong>What is the community asking for?<\u002Fstrong> Discord, in-game behavior.<\u002Fdiv><\u002Fli>\n        <li><div><strong>Does this serve the design pillars?<\u002Fstrong> (See §3.)<\u002Fdiv><\u002Fli>\n        <li><div><strong>Can we ship a meaningful version <em>quickly<\u002Fem>?<\u002Fstrong><\u002Fdiv><\u002Fli>\n        <li><div><strong>Does this open new content runway, or close it?<\u002Fstrong><\u002Fdiv><\u002Fli>\n      <\u002Fol>\n      <div class=\"callout\">\n        <p><strong>When in doubt: ship fast and iterate.<\u002Fstrong> The Bloxodachi advantage is execution velocity, not first-pass polish. Polish comes from iterating on real player response.<\u002Fp>\n        <p style=\"margin-top:6px\"><strong>Resist:<\u002Fstrong> scope creep · perfection-before-shipping · ignoring data because the team has opinions · building for hypothetical players instead of actual ones.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"margin-top:22px\">§10.2 · Decision authority &amp; creative direction flow<\u002Fh3>\n      <div class=\"card\">\n        <ul>\n          <li><strong>Creative direction and the “sacred” list (§4) flow from the founder.<\u002Fstrong> When in doubt about anything sacred, ask before building.<\u002Fli>\n          <li><strong>Within the flexible list, contributors have real latitude<\u002Fstrong> — bring a working slice, not a proposal deck.<\u002Fli>\n          <li><strong>New features that aren't on the plan get checked in first.<\u002Fstrong> If you think something belongs on the roadmap, add it to <code>docs/PLAN.md<\u002Fcode> and flag it — don't silently build it.<\u002Fli>\n          <li><strong>The founder favors lean process.<\u002Fstrong> Name the cost of overhead up front; default to the lightest workflow that works. Heavy collaboration ceremony is friction, not safety.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <h3 style=\"margin-top:22px\">§10.3 · Brand voice guardrails<\u002Fh3>\n      <div class=\"voice-card\">\n        <p>The voice is a real brand asset. All player-facing text — in-game strings, announcements, marketing, social, descriptions — follows it.<\u002Fp>\n        <p style=\"margin-top:8px\"><strong>Tonal principles:<\u002Fstrong> slightly chaotic but never mean · affectionate sarcasm <em>toward Robloxians, never toward players<\u002Fem> · self-aware about absurdity without explaining it · warm and inclusive without being saccharine.<\u002Fp>\n        <p style=\"margin-top:8px\"><strong>Hard rules:<\u002Fstrong> never explain a joke · never apologize for absurdity · reference established lore as community in-jokes (the missing llamas, the router from the sky, the unbothered Robloxians in front of PNG backgrounds) · lowercase is fine in casual social contexts.<\u002Fp>\n\n        <h4 style=\"margin-top:14px\">Calibration samples<\u002Fh4>\n        <div class=\"samples\">\n          <blockquote>your island is about to be a full soap opera and i will not be apologizing<\u002Fblockquote>\n          <blockquote>his llamas are nearby but unaccounted for. he does not accept emeralds<\u002Fblockquote>\n          <blockquote>sometimes a beehive falls out. this is not your problem. it is very much your nearest resident's problem<\u002Fblockquote>\n          <blockquote>your residents found a router. it fell from the sky. nobody is asking questions<\u002Fblockquote>\n        <\u002Fdiv>\n\n        <p style=\"margin-top:14px; font-size:.92em; color:var(--ink-soft)\"><strong>Note:<\u002Fstrong> in <em>community<\u002Fem> copy the characters are often called “residents” for vibe; in <em>game UI and code<\u002Fem> they are always “Robloxians.” Keep that line.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"margin-top:22px\">§10.4 · Working in the codebase <span style=\"font-size:.65em; color:var(--ink-mute); font-weight:normal\">— for engineers / AI agents<\u002Fspan><\u002Fh3>\n      <div class=\"card\" style=\"background:#ecdfb8; border-color:#c8b27a; font-family:'JetBrains Mono'; font-size:.92rem; line-height:1.55\">\n        <ul>\n          <li>Read <code>AGENTS.md<\u002Fcode>, <code>docs/PLAN.md<\u002Fcode>, <code>docs/COLLAB.md<\u002Fcode>, and recent <code>git log<\u002Fcode> before starting.<\u002Fli>\n          <li><strong>Git is the change history.<\u002Fstrong> COLLAB.md is reserved for non-obvious gotchas and sticky decisions only.<\u002Fli>\n          <li><strong>Land working slices.<\u002Fstrong> If you stop mid-feature, commit what works.<\u002Fli>\n          <li><strong>No speculative abstractions, no backwards-compat shims.<\u002Fstrong> Greenfield — delete unused code, don't comment it out.<\u002Fli>\n          <li>Multi-agent repo (Claude + Codex). Check live working sets before editing a file another agent owns.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- GLOSSARY -->\n    <section class=\"s\" id=\"sA\">\n      <span class=\"s-tag\">APPENDIX<\u002Fspan>\n      <h2>Glossary<\u002Fh2>\n      <div class=\"gloss\">\n        <dl>\n          <dt>Robloxian<\u002Fdt><dd>An NPC character. The only acceptable name in code and player-facing text.<\u002Fdd>\n          <dt>God-view<\u002Fdt><dd>The top-down observer camera; the player has no avatar.<\u002Fdd>\n          <dt>Happiness<\u002Fdt><dd>The visible level-progress meter; doubles as the Coin reward signal. There is no separate EXP.<\u002Fdd>\n          <dt>Heart Shop<\u002Fdt><dd>The permanent-bundle storefront (Game Passes, founder items).<\u002Fdd>\n          <dt>The Altar / Museum / Trophy Hall<\u002Fdt><dd>The three God Realm (Sky Island) spaces.<\u002Fdd>\n          <dt>Animalese<\u002Fdt><dd>The letter-chirp voice style; placeholder for a possible future TTS engine.<\u002Fdd>\n          <dt>Cards / Pages<\u002Fdt><dd>The portable character-identity feature (§7).<\u002Fdd>\n          <dt>Founders Pass / Founder's Spirit<\u002Fdt><dd>Recognition-based supporter purchases.<\u002Fdd>\n          <dt>The router from the sky · the missing llamas · unbothered PNG residents<\u002Fdt><dd>Established lore in-jokes. Use them; never explain them.<\u002Fdd>\n        <\u002Fdl>\n      <\u002Fdiv>\n\n      <div class=\"div-doodle\">·  ·  ·<\u002Fdiv>\n\n      <footer class=\"foot\">\n        <span>Bloxodachi Life — internal vision doc, draft.<\u002Fspan>\n        <span>🌙 Be kind to your Robloxians.<\u002Fspan>\n      <\u002Ffooter>\n    <\u002Fsection>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<script>\n  // Mobile menu\n  const btn = document.getElementById('menu-btn');\n  const toc = document.getElementById('toc');\n  if (btn && toc) {\n    btn.addEventListener('click', () => {\n      const open = toc.classList.toggle('open');\n      btn.setAttribute('aria-expanded', open ? 'true' : 'false');\n    });\n    toc.addEventListener('click', (e) => {\n      if (e.target.tagName === 'A' && window.matchMedia('(max-width: 980px)').matches) {\n        toc.classList.remove('open');\n        btn.setAttribute('aria-expanded', 'false');\n      }\n    });\n  }\n\n  // Active-section highlight: deterministic topmost section whose top has passed the trigger line\n  const links = Array.from(document.querySelectorAll('nav.toc a'));\n  const sections = links\n    .map(a => ({ a, el: document.getElementById(a.getAttribute('href').slice(1)) }))\n    .filter(x => x.el);\n  function updateActive(){\n    const triggerY = 120; // px from top of viewport\n    let current = sections[0];\n    for (const s of sections) {\n      const top = s.el.getBoundingClientRect().top;\n      if (top - triggerY <= 0) current = s; else break;\n    }\n    links.forEach(l => l.classList.remove('active'));\n    if (current) current.a.classList.add('active');\n  }\n  let raf = 0;\n  function onScroll(){\n    if (raf) return;\n    raf = requestAnimationFrame(() => { raf = 0; updateActive(); });\n  }\n  window.addEventListener('scroll', onScroll, { passive: true });\n  window.addEventListener('resize', onScroll);\n  updateActive();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
